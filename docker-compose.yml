services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: safesphere
      POSTGRES_PASSWORD: safesphere
      POSTGRES_DB: safesphere
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safesphere"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://safesphere:safesphere@db:5432/safesphere
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
volumes:
  pgdata:
